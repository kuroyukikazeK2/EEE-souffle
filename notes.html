<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes | Lee Heng Hao Ernest</title>
  <meta name="description" content="Compiled course notes and submissions.">
  <meta name="theme-color" content="#f3f4ec">
  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">

  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <a class="brand" href="index.html">Lee Heng Hao Ernest</a>
    <nav aria-label="Main">
      <a href="index.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="notes.html" aria-current="page">Notes</a>
      <a href="cv.pdf">CV</a>
      <button id="theme" type="button" class="plain">dark</button>
    </nav>
  </header>

  <main id="main" class="page">
    <section id="view-notes">
      <div class="page-banner">
        <h1>Notes</h1>
        <p class="lede" data-words>Compiled notes from courses I have taken in polytechnic and NTU, together with my personal notes or submissions.</p>
      </div>

      <!-- Clean Search Header -->
      <div class="search-header">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="notes-search" 
            placeholder="Filter by course code or title" 
            autocomplete="off"
          />
          <button id="clear-search" aria-label="Clear search" hidden>&times;</button>
        </div>
        <div id="matches-count" class="matches-count">Loading notes...</div>
      </div>

      <!-- Dynamic List Container -->
      <div id="notes-container" class="notes-list-container">
        <!-- JS will inject the level sidebar and list rows here -->
      </div>

    </section>
  </main>

  <footer class="foot">
    <span>© <span id="yr">2026</span> Lee Heng Hao Ernest</span>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
